name: Release

# Neues Release:  Version in Cargo.toml anheben, CHANGELOG ergänzen, dann
#   git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} passt nicht zu Cargo.toml ($v)" }

      - name: Test
        run: cargo test --release --locked

      - name: Build & package
        shell: pwsh
        run: ./tools/package.ps1

      # Release-Text = Abschnitt dieser Version aus CHANGELOG.md (erscheint auch im Update-Dialog der App)
      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $c = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($c, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "Kein CHANGELOG-Abschnitt für $v" }
          $m.Groups[1].Value.Trim() | Set-Content -Encoding utf8 release-notes.md
          Get-Content release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: WiFi Analyzer ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/WiFiAnalyzer-*-win64.zip
            dist/WiFiAnalyzer.exe
            dist/SHA256SUMS.txt
