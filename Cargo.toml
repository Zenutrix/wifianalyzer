[package]
name = "wifi-analyzer"
version = "2.0.0"
edition = "2021"
rust-version = "1.80"
authors = ["Thomas Schöpf"]
description = "Wi-Fi analyzer for Windows technicians: networks, channels, findings, walk surveys with roaming detection"
license = "GPL-3.0-or-later"
homepage = "https://wifianalyzer.schoepf-tirol.at"
repository = "https://github.com/zenutrix/wifianalyzer"
readme = "README.md"
keywords = ["wifi", "wlan", "analyzer", "windows", "survey"]
categories = ["network-programming", "command-line-utilities"]
publish = false

[dependencies]
eframe = "0.29.1"
egui_plot = "0.29.0"
egui_extras = "0.29.1"
chrono = "0.4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Devices_WiFi",
    "Devices_Geolocation",
    "Win32_System_WinRT",
]

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WiFi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_Globalization",
    "Win32_UI_Shell",
    "Win32_System_Com",
]

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
