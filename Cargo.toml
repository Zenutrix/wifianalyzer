[package]
name = "wifi-analyzer"
version = "1.3.0"
edition = "2021"
description = "WLAN-Analyzer für Windows (Native WiFi API + egui)"

[dependencies]
eframe = "0.29.1"
egui_plot = "0.29.0"
egui_extras = "0.29.1"
chrono = "0.4"
rfd = "0.15"

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Devices_WiFi",
    "Devices_Geolocation",
    "Win32_System_WinRT",
]

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WiFi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_Globalization",
]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
